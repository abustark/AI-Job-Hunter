{% extends 'base.html' %}{% block title %}Add a job · AI Job Hunter{% endblock %}{% block content %}<p class="eyebrow"><a href="{{ url_for('main.jobs') }}">JOBS</a> / MANUAL ENTRY</p><section class="page-heading compact"><div><h1>Add a job</h1><p class="muted">Save a listing you found anywhere. Unknown details can stay blank.</p></div></section><form class="panel form-grid" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Job title *<input name="title" maxlength="180" required value="{{ values.get('title','') }}"></label><label>Company *<input name="company" maxlength="180" required value="{{ values.get('company','') }}"></label><label class="span-2">Original listing URL<input type="url" name="url" placeholder="https://…" value="{{ values.get('url','') }}"></label><label>Market scope<select name="scope"><option value="India" {{ 'selected' if values.get('scope','India')=='India' }}>India</option><option value="International" {{ 'selected' if values.get('scope')=='International' }}>International</option></select></label><label>Country / region<input name="country" value="{{ values.get('country','India') }}" placeholder="Unknown is okay"></label><label>Location<input name="location" value="{{ values.get('location','') }}"></label><label>Work mode<select name="work_mode">{% for x in ['Unknown','Remote','Hybrid','On-site'] %}<option value="{{ x }}" {{ 'selected' if values.get('work_mode','Unknown')==x }}>{{ x }}</option>{% endfor %}</select></label><label class="span-2">Eligible countries / regions<input name="eligibility" value="{{ values.get('eligibility','') }}" placeholder="Enter only what the listing states"></label><label>Visa / work permit<input name="visa_info" value="{{ values.get('visa_info','') }}" placeholder="Not specified if unknown"></label><label>Sponsorship<input name="sponsorship" value="{{ values.get('sponsorship','') }}"></label><label>Relocation<input name="relocation" value="{{ values.get('relocation','') }}"></label><label>Source<input name="source" value="{{ values.get('source','Manual') }}" maxlength="80"></label><label>Status<select name="status">{% for s in statuses %}<option {{ 'selected' if values.get('status','To Review')==s }}>{{ s }}</option>{% endfor %}</select></label><label>Posted date<input type="date" name="posted_at"></label><label>Salary / compensation<input name="salary" placeholder="Only if listed"></label><label>Employment type<input name="job_type"></label><label>Seniority<input name="seniority"></label><label class="span-2">Skills / keywords<input name="skills" placeholder="SQL, Python, dashboards"></label><label class="span-2">Job description<textarea name="description" rows="8" maxlength="30000"></textarea></label><label class="span-2">Your notes<textarea name="notes" rows="3"></textarea></label><div class="span-2 form-actions"><button class="button primary">Save to review queue</button><a class="button quiet" href="{{ url_for('main.jobs') }}">Cancel</a></div></form>{% endblock %}
